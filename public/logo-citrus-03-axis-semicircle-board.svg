<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Citrus C axis semicircle comparison</title>
  <desc id="desc">The unchanged C mark compared with the same mark plus the requested semicircle along the long axis.</desc>
  <rect width="1200" height="560" fill="#1976C5"/>
  <text x="72" y="68" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" letter-spacing="3">酸橙云 / C · AXIS SEMICIRCLE</text>
  <text x="72" y="103" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" opacity="0.82">LONG AXIS ENDPOINTS · RIGHT / LOWER HALF CIRCLE</text>

  <g transform="translate(72 145)">
    <rect width="500" height="330" rx="32" fill="#1976C5" stroke="#FFD23F" stroke-width="3"/>
    <g transform="translate(122 22) scale(.50)">
      <g transform="rotate(-12 256 256) translate(256 256) skewX(-10) translate(-256 -256)">
        <circle cx="256" cy="256" r="154" fill="none" stroke="#FFD23F" stroke-width="28"/>
        <g fill="none" stroke="#FFD23F" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M256 256c-33-39-48-87-37-140"/>
          <path d="M256 256c-33-39-48-87-37-140" transform="rotate(60 256 256)"/>
          <path d="M256 256c-33-39-48-87-37-140" transform="rotate(120 256 256)"/>
          <path d="M256 256c-33-39-48-87-37-140" transform="rotate(180 256 256)"/>
          <path d="M256 256c-33-39-48-87-37-140" transform="rotate(240 256 256)"/>
          <path d="M256 256c-33-39-48-87-37-140" transform="rotate(300 256 256)"/>
        </g>
        <circle cx="256" cy="256" r="21" fill="#1976C5" stroke="#FFD23F" stroke-width="12"/>
      </g>
    </g>
    <text x="32" y="298" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" letter-spacing="2">C · ORIGINAL / UNCHANGED</text>
  </g>

  <g transform="translate(628 145)">
    <rect width="500" height="330" rx="32" fill="#1976C5" stroke="#FFD23F" stroke-width="3"/>
    <g transform="translate(122 22) scale(.50)">
