  <text x="72" y="103" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" opacity="0.82">CUT FACE + HEMISPHERE BODY · NOT A THICKER RIND</text>

  <g transform="translate(72 145)">
