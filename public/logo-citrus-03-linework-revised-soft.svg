<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Citrus linework revised soft</title>
  <desc id="desc">A softer perspective version of the citrus linework mark with a hollow center and six extended bars.</desc>
  <rect width="512" height="512" rx="112" fill="#1976C5"/>
  <g transform="rotate(-5 256 256) translate(256 256) skewX(-4) translate(-256 -256)">
    <circle cx="256" cy="256" r="154" fill="none" stroke="#FFD23F" stroke-width="22"/>
    <g fill="none" stroke="#FFD23F" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 256c-29-36-42-81-34-137"/>
      <path d="M256 256c-29-36-42-81-34-137" transform="rotate(60 256 256)"/>
      <path d="M256 256c-29-36-42-81-34-137" transform="rotate(120 256 256)"/>
      <path d="M256 256c-29-36-42-81-34-137" transform="rotate(180 256 256)"/>
      <path d="M256 256c-29-36-42-81-34-137" transform="rotate(240 256 256)"/>
      <path d="M256 256c-29-36-42-81-34-137" transform="rotate(300 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="18" fill="#1976C5" stroke="#FFD23F" stroke-width="10"/>
  </g>
