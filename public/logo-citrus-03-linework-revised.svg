  <g transform="rotate(-8 256 256) translate(256 256) skewX(-7) translate(-256 -256)">
    <circle cx="256" cy="256" r="154" fill="none" stroke="#FFD23F" stroke-width="26"/>
    <g fill="none" stroke="#FFD23F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 256c-31-38-45-84-36-137"/>
      <path d="M256 256c-31-38-45-84-36-137" transform="rotate(60 256 256)"/>
      <path d="M256 256c-31-38-45-84-36-137" transform="rotate(120 256 256)"/>
      <path d="M256 256c-31-38-45-84-36-137" transform="rotate(180 256 256)"/>
      <path d="M256 256c-31-38-45-84-36-137" transform="rotate(240 256 256)"/>
      <path d="M256 256c-31-38-45-84-36-137" transform="rotate(300 256 256)"/>
    </g>
