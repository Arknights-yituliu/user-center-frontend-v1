<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Citrus linework revised</title>
  <desc id="desc">The original citrus linework mark refined with a hollow center, six extended bars, and a slight perspective tilt.</desc>
