<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Citrus linework perspective revisions</title>
  <desc id="desc">The original citrus linework mark and three revisions with a hollow center, extended bars, and different perspective strengths.</desc>
  <rect width="1200" height="800" fill="#1976C5"/>
  <text x="72" y="68" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" letter-spacing="3">酸橙云 / 03 LINEWORK REVISIONS</text>
  <text x="72" y="103" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" opacity="0.82">HOLLOW CORE · EXTENDED BARS · LIGHT PERSPECTIVE</text>

  <g transform="translate(72 140)">
    <rect width="500" height="280" rx="32" fill="#1976C5" stroke="#FFD23F" stroke-width="3"/>
    <g transform="translate(122 14) scale(.50)">
      <circle cx="256" cy="256" r="154" fill="none" stroke="#FFD23F" stroke-width="26"/>
      <g fill="none" stroke="#FFD23F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M256 256c-31-35-46-78-39-118"/>
        <path d="M256 256c-31-35-46-78-39-118" transform="rotate(60 256 256)"/>
        <path d="M256 256c-31-35-46-78-39-118" transform="rotate(120 256 256)"/>
        <path d="M256 256c-31-35-46-78-39-118" transform="rotate(180 256 256)"/>
        <path d="M256 256c-31-35-46-78-39-118" transform="rotate(240 256 256)"/>
        <path d="M256 256c-31-35-46-78-39-118" transform="rotate(300 256 256)"/>
