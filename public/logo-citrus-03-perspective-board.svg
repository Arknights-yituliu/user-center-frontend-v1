      <circle cx="256" cy="256" r="18" fill="#FFD23F"/>
    </g>
    <text x="32" y="250" fill="#FFD23F" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ORIGINAL 03</text>
  </g>

  <g transform="translate(628 140)">
    <rect width="500" height="280" rx="32" fill="#1976C5" stroke="#FFD23F" stroke-width="3"/>
